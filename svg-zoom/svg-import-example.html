<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Image Import Example</title>
</head>
<body>
  <h1>SVG Image Embedded and Imported</h1>

   <hr >
   <h2> IMG </h2>
<img src="sequenceDiagram.svg" />

   <hr >
   <h2> Object </h2>

<object data="sequenceDiagram.svg" type="image/svg+xml">

</object>

   <hr >
   <h2> IFrame </h2>

<iframe src="sequenceDiagram.svg">

</iframe>
    
   <hr >
   <h2> embedded </h2>

<embed src="sequenceDiagram.svg" type="image/svg+xml">

</body>
</html>
